<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDNA Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 class="title">CDNA board</h1>
        <p class="subtitle" id="subtitle">Closed Door No AMI balances</p>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-request" id="open-request" type="button">Request CDNA</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Find a name" aria-label="Find a name">
      <span class="updated" id="updated"></span>
    </div>
    <div id="board" class="board" aria-live="polite"></div>
  </main>

  <p class="footer">
    Form 10 not downloading inside Teams? <a href="./" target="_blank" rel="noopener">Open this page in your browser</a>.
  </p>

  <dialog id="request" aria-labelledby="req-title">
    <div class="dlg-head">
      <h2 id="req-title">Request a CDNA</h2>
      <button class="x" type="button" data-close aria-label="Close">&times;</button>
    </div>
    <div class="dlg-body" id="req-body"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
